<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IE Smart Translator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #1c1e21;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #0d47a1;
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .language-select {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }

        select {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #fff;
        }

        .translator-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .text-box-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: none;
            font-size: 0.95rem;
        }

        textarea:focus {
            outline: none;
            border-color: #0d47a1;
        }

        .output-box {
            background-color: #f8f9fa;
        }

        .box-tools {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .btn-tool {
            padding: 6px 12px;
            background-color: #e4e6eb;
            color: #333;
            border: none;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-tool:hover {
            background-color: #d8dadf;
        }

        .btn-container {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .btn-primary {
            flex: 1;
            padding: 12px;
            background-color: #0d47a1;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background-color: #1565c0;
        }

        .btn-swap {
            flex: 0 0 50px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .btn-swap:hover {
            background-color: #5a6268;
        }

        .status-text {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>IE Smart Translator</h1>

        <!-- Pengaturan Bahasa -->
        <div class="language-select">
            <select id="sourceLang">
                <option value="id">Indonesia</option>
                <option value="en" selected>Inggris</option>
                <option value="ja">Jepang</option>
                <option value="zh">Mandarin</option>
                <option value="de">Jerman</option>
                <option value="ar">Arab</option>
            </select>

            <button class="btn-swap" onclick="swapLanguages()" title="Tukar Bahasa">⇄</button>

            <select id="targetLang">
                <option value="id" selected>Indonesia</option>
                <option value="en">Inggris</option>
                <option value="ja">Jepang</option>
                <option value="zh">Mandarin</option>
                <option value="de">Jerman</option>
                <option value="ar">Arab</option>
            </select>
        </div>

        <!-- Input & Output Text Area -->
        <div class="translator-grid">
            <div class="text-box-container">
                <textarea id="inputText" placeholder="Ketik teks di sini..."></textarea>
                <div class="box-tools">
                    <button class="btn-tool" onclick="speakText('inputText', 'sourceLang')">🔊 Suara</button>
                    <button class="btn-tool" onclick="clearInput()">🗑️ Hapus</button>
                </div>
            </div>

            <div class="text-box-container">
                <textarea id="outputText" class="output-box" placeholder="Hasil penerjemahan akan muncul di sini..." readonly></textarea>
                <div class="box-tools">
                    <button class="btn-tool" onclick="speakText('outputText', 'targetLang')">🔊 Suara</button>
                    <button class="btn-tool" onclick="copyResult()">📋 Salin</button>
                </div>
            </div>
        </div>

        <!-- Tombol Aksi Utama -->
        <div class="btn-container">
            <button class="btn-primary" onclick="translateText()">Terjemahkan Sekarang</button>
        </div>
        <div class="status-text" id="statusText"></div>
    </div>

    <script>
        function translateText() {
            const input = document.getElementById('inputText').value.trim();
            const sourceLang = document.getElementById('sourceLang').value;
            const targetLang = document.getElementById('targetLang').value;
            const outputArea = document.getElementById('outputText');
            const statusText = document.getElementById('statusText');

            if (!input) {
                outputArea.value = '';
                statusText.textContent = 'Masukkan teks terlebih dahulu.';
                return;
            }

            statusText.textContent = 'Menerjemahkan...';

            // Menghapus elemen script lama jika ada
            const oldScript = document.getElementById('jsonp-script');
            if (oldScript) oldScript.remove();

            // Membuat callback unik untuk menangani respons JSONP (Bypass CORS)
            window.handleTranslation = function(response) {
                if (response && response.responseData) {
                    outputArea.value = response.responseData.translatedText;
                    statusText.textContent = 'Selesai menerjemahkan.';
                } else {
                    statusText.textContent = 'Gagal menerjemahkan teks.';
                }
            };

            // Memanggil API MyMemory via skrip dinamis
            const script = document.createElement('script');
            script.id = 'jsonp-script';
            script.src = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(input)}&langpair=${sourceLang}|${targetLang}&callback=handleTranslation`;
            
            script.onerror = function() {
                statusText.textContent = 'Gagal terhubung ke server. Pastikan Anda terhubung ke internet.';
            };

            document.body.appendChild(script);
        }

        function swapLanguages() {
            const sourceSelect = document.getElementById('sourceLang');
            const targetSelect = document.getElementById('targetLang');
            const temp = sourceSelect.value;
            sourceSelect.value = targetSelect.value;
            targetSelect.value = temp;
        }

        function copyResult() {
            const outputText = document.getElementById('outputText').value;
            if (!outputText) return;
            navigator.clipboard.writeText(outputText).then(() => {
                alert('Teks berhasil disalin!');
            });
        }

        function clearInput() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
            document.getElementById('statusText').textContent = '';
        }

        function speakText(areaId, langSelectId) {
            const text = document.getElementById(areaId).value;
            const lang = document.getElementById(langSelectId).value;
            if (!text) return;

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
